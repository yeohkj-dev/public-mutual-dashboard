name: Update fund data

on:
  schedule:
    - cron: "0 3 * * 1-5"  # 11:00 Malaysia time, Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/funds.js
          git diff --cached --quiet || git commit -m "Update fund data $(date -u +%F)"
          git push
