name: Update fund data

# Runs on GitHub's servers every day. It does not depend on Claude or any
# local computer: GitHub starts it, fetches the data, commits it, and the
# GitHub Pages site picks up the new files automatically.

# Times are UTC; Malaysia is UTC+8. Jobs set exactly on the hour wait longest
# in GitHub's queue (on 21 Nov 2026 the 04:00 job waited 2 h 46 min), so the
# schedule uses an off-peak minute, and a backup run fills in if the first
# one hasn't published that day.
on:
  schedule:
    - cron: "23 3 * * *"  # main run: 11:23 am MYT, every day
    - cron: "23 6 * * *"  # backup: 2:23 pm MYT, skipped if today's data is already in
  workflow_dispatch:      # "Run workflow" button on the Actions tab, for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip backup run if today's data is already published
        id: check
        run: |
          generated=$(grep -o '"generated":"[0-9-]*' data/funds.js | head -1 | cut -d'"' -f4)
          if [ "${{ github.event.schedule }}" = "23 6 * * *" ] && [ "$generated" = "$(date -u +%F)" ]; then
            echo "Data for $generated is already published; backup run not needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install pymupdf
        if: steps.check.outputs.run == 'true'
      - name: Prices (unit trust + PRS)
        if: steps.check.outputs.run == 'true'
        run: python scripts/fetch_data.py
      # Holdings and indices are optional: if either source has a bad day the
      # step keeps the previous data and the price update still goes out.
      - name: Holdings (only re-parses reports that changed)
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_holdings.py
      - name: World indices
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_indices.py
      - name: Commit if changed
        if: always() && steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/funds.js data/holdings.js data/indices.js
          git diff --cached --quiet || git commit -m "Update fund data $(date -u +%F)"
          git pull --rebase origin main
          git push
