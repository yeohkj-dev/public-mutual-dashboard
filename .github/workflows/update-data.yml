name: Update fund data

on:
  schedule:
    - cron: "0 4 * * *"  # 12:00 noon Malaysia time (UTC+8), every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf
      - name: Prices (unit trust + PRS)
        run: python scripts/fetch_data.py
      - name: Holdings (only re-parses reports that changed)
        run: python scripts/fetch_holdings.py
      - name: World indices
        run: python scripts/fetch_indices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/funds.js data/holdings.js data/indices.js
          git diff --cached --quiet || git commit -m "Update fund data $(date -u +%F)"
          git push
